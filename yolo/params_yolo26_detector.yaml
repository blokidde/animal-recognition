# YOLO26 normal detection training on original iNaturalist images with DeepFaune pseudo-bboxes.
# DeepFaune provides the bbox; this model learns the species classes on the normal photos.

dataset_mode: deepfaune_boxes
metadata_csv: D:\datasets\animal_alive_deepfaune_top500\_metadata\selected_images.csv
prepared_root: D:\datasets\animal_alive_yolo26_det_deepfaune_boxes

# Rebuild the prepared YOLO detection dataset from scratch.
# Leave false for normal reruns; set true after changing split ratios or source data.
regenerate_dataset: false
link_method: hardlink

train_ratio: 0.70
val_ratio: 0.15
test_ratio: 0.15
seed: 42

# Display names YOLO will show in metrics and predictions.
# Labels keep the same stable class IDs; this only changes readable names.
class_name_map:
  Alopochen_aegyptiaca: Egyptian Goose
  Anas_clypeata: Northern Shoveler
  Anas_crecca: Eurasian Teal
  Anas_penelope: Eurasian Wigeon
  Anas_platyrhynchos: Mallard
  Anas_querquedula: Garganey
  Anser_albifrons: Greater White-fronted Goose
  Anser_fabalis: Bean Goose
  Aythya_ferina: Common Pochard
  Branta_canadensis: Canada Goose
  Branta_leucopsis: Barnacle Goose
  Branta_ruficollis: Red-breasted Goose
  Canis_lupus: Gray Wolf
  Capreolus_capreolus: Roe Deer
  Castor_fiber: Eurasian Beaver
  Cervus_elaphus: Red Deer
  Dama_dama: Fallow Deer
  Lepus_europaeus: European Hare
  Lutra_lutra: Eurasian Otter
  Lynx_lynx: Eurasian Lynx
  Martes_foina: Beech Marten
  Martes_martes: European Pine Marten
  Meles_meles: European Badger
  Mustela_erminea: Stoat
  Mustela_nivalis: Least Weasel
  Mustela_putorius: European Polecat
  Nyctereutes_procyonoides: Raccoon Dog
  Oryctolagus_cuniculus: European Rabbit
  Phasianus_colchicus: Common Pheasant
  Procyon_lotor: Common Raccoon
  Rupicapra_rupicapra: Northern Chamois
  Sus_scrofa: Wild Boar
  Tadorna_tadorna: Common Shelduck
  Ursus_arctos: Brown Bear
  Vulpes_vulpes: Red Fox

# Balance class weight in training by duplicating minority-class train images.
# Validation/test are not oversampled, so metrics stay honest.
oversample_train_classes: true
oversample_target_train_images: 350
oversample_max_extra_copies: 5

# Normal detection checkpoint, not -seg and not -cls.
model_name: yolo26n.pt

# Training settings based on run 1 11 juni, with longer full training.
epochs: 500
patience: 500
image_size: 640
batch_size: 48
num_workers: 4

# Set device to 0 for GPU, cpu for CPU, or "" for Ultralytics auto.
device: 0
amp: true
cache: false
resume: false

# Optimizer / LR settings from run 1 args.yaml.
optimizer: auto
lr0: 0.01
lrf: 0.01
weight_decay: 0.0005
warmup_epochs: 3.0
cos_lr: false

# Augmentation settings from run 1 args.yaml.
mosaic: 0.0
close_mosaic: 10
mixup: 0.0
copy_paste: 0.0
degrees: 5
translate: 0.05
scale: 0.25
fliplr: 0.5
hsv_h: 0.01
hsv_s: 0.35
hsv_v: 0.25

# Runs are saved under checkpoints_root/<model_name_without_extension>/run N <datum>
checkpoints_root: checkpoints/detection_model
run_name: ""